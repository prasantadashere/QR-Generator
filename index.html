<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meow Meow QR Generator</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 360px;
      text-align: center;
    }

    .card-header-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 16px;
      display: block;
      background-color: #e5e7eb;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 16px;
      color: #1a1a1a;
      font-size: 1.25rem;
    }

    .input-group {
      display: flex;
      gap: 8px;
      width: 100%;
      margin-bottom: 16px;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid #cccccc;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #0066ff;
    }

    .paste-btn {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      padding: 0;
      border: 1px solid #cccccc;
      border-radius: 6px;
      background-color: #f8fafc;
      color: #333333;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .paste-btn:hover {
      background-color: #e5e7eb;
    }

    .paste-btn:active {
      transform: scale(0.96);
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-generate {
      background-color: #0066ff;
      color: white;
    }

    .btn-generate:hover {
      background-color: #0052cc;
    }

    .btn-download {
      background-color: #10b981;
      color: white;
    }

    .btn-download:hover {
      background-color: #059669;
    }

    button:disabled {
      background-color: #e5e7eb;
      color: #9ca3af;
      cursor: not-allowed;
    }

    .qr-preview-wrapper {
      background-color: #e2e8f0;
      padding: 16px;
      border-radius: 8px;
      display: inline-block;
    }

    #qrcode-container {
      background-color: #ffffff;
      padding: 8px;
      border-radius: 4px;
      display: inline-block;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    #qrcode-container canvas,
    #qrcode-container img {
      display: block;
    }

    .credits {
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid #e5e7eb;
      font-size: 11px;
      line-height: 1.5;
      color: #6b7280;
    }

    .credits a {
      color: #0066ff;
      text-decoration: none;
    }

    .credits a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="card">

    <img
      id="header-image"
      class="card-header-img"
      alt="Meow Meow"
    >

    <h2>Meow Meow QR Generator</h2>

    <div class="input-group">
      <input
        type="text"
        id="qr-text"
        placeholder="Enter URL or Text"
        value="https://example.com"
      >

      <button
        class="paste-btn"
        onclick="pasteFromClipboard()"
        title="Paste from clipboard">
        📋
      </button>
    </div>

    <div class="btn-group">

      <button
        class="btn-generate"
        onclick="generateQRCode()">
        Generate
      </button>

      <button
        class="btn-download"
        id="download-btn"
        onclick="downloadQRCode()"
        disabled>
        Download
      </button>

    </div>

    <div class="qr-preview-wrapper">
      <div id="qrcode-container"></div>
    </div>

    <div class="credits">
      <div>
        QR Code generated using
        <a
          href="https://github.com/davidshimjs/qrcodejs"
          target="_blank"
          rel="noopener noreferrer">
          QRCode.js
        </a>
        under the MIT License.
      </div>

      <div>
        Cat images from
        <a
          href="https://www.kaggle.com/datasets/vekosek/cats-from-memes"
          target="_blank"
          rel="noopener noreferrer">
          Cats from Memes
        </a>
        by Vekosek, licensed under Apache License 2.0.
      </div>
    </div>

  </div>

  <script>
    const GITHUB_USERNAME = "prasantadashere";
    const GITHUB_REPOSITORY = "QR-Generator";
    const IMAGE_FOLDER = "meowColony";

    async function setRandomImage() {
      const imageElement =
        document.getElementById("header-image");

      try {
        const apiURL =
          `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPOSITORY}/contents/${IMAGE_FOLDER}?per_page=1000`;

        const response =
          await fetch(apiURL);

        if (!response.ok) {
          throw new Error("Unable to load images.");
        }

        const files =
          await response.json();

        const imageFiles =
          files.filter(file => {
            if (file.type !== "file") {
              return false;
            }

            const name =
              file.name.toLowerCase();

            return (
              name.endsWith(".jpg") ||
              name.endsWith(".jpeg") ||
              name.endsWith(".png") ||
              name.endsWith(".webp") ||
              name.endsWith(".gif")
            );
          });

        if (imageFiles.length === 0) {
          throw new Error("No images found.");
        }

        const randomIndex =
          Math.floor(
            Math.random() * imageFiles.length
          );

        imageElement.src =
          imageFiles[randomIndex].download_url;

      } catch (error) {
        console.error(error);
      }
    }

    let qrcodeObj = null;

    function generateQRCode() {
      const text =
        document
          .getElementById("qr-text")
          .value
          .trim();

      const container =
        document.getElementById("qrcode-container");

      const downloadBtn =
        document.getElementById("download-btn");

      if (!text) {
        alert("Please enter text or a URL!");
        return;
      }

      container.innerHTML = "";

      qrcodeObj =
        new QRCode(container, {
          text: text,
          width: 200,
          height: 200,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });

      downloadBtn.disabled = false;
    }

    async function pasteFromClipboard() {
      try {
        const text =
          await navigator.clipboard.readText();

        if (!text) {
          alert("Clipboard is empty.");
          return;
        }

        const input =
          document.getElementById("qr-text");

        input.value = text;

        generateQRCode();

      } catch (error) {
        alert(
          "Unable to access the clipboard. Please allow clipboard permission in your browser."
        );
      }
    }

    function downloadQRCode() {
      const container =
        document.getElementById("qrcode-container");

      const sourceCanvas =
        container.querySelector("canvas");

      if (!sourceCanvas) {
        alert("Please generate a QR code first!");
        return;
      }

      const borderSize = 12;

      const exportCanvas =
        document.createElement("canvas");

      const ctx =
        exportCanvas.getContext("2d");

      exportCanvas.width =
        sourceCanvas.width +
        borderSize * 2;

      exportCanvas.height =
        sourceCanvas.height +
        borderSize * 2;

      ctx.fillStyle = "#ffffff";

      ctx.fillRect(
        0,
        0,
        exportCanvas.width,
        exportCanvas.height
      );

      ctx.drawImage(
        sourceCanvas,
        borderSize,
        borderSize
      );

      const link =
        document.createElement("a");

      link.download =
        "meow-meow-qrcode.png";

      link.href =
        exportCanvas.toDataURL("image/png");

      link.click();
    }

    window.onload = function() {
      setRandomImage();
      generateQRCode();
    };
  </script>

</body>
</html>
