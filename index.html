<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Generator</title>
  <!-- QRCode.js Library CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 360px;
      text-align: center;
    }

    /* Style for the local image placed above the heading */
    .card-header-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 16px;
      color: #1a1a1a;
      font-size: 1.25rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cccccc;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 16px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #0066ff;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-generate {
      background-color: #0066ff;
      color: white;
    }

    .btn-generate:hover {
      background-color: #0052cc;
    }

    .btn-download {
      background-color: #10b981;
      color: white;
    }

    .btn-download:hover {
      background-color: #059669;
    }

    button:disabled {
      background-color: #e5e7eb;
      color: #9ca3af;
      cursor: not-allowed;
    }

    .qr-preview-wrapper {
      background-color: #e2e8f0;
      padding: 16px;
      border-radius: 8px;
      display: inline-block;
    }

    /* White border container around QR code */
    #qrcode-container {
      background-color: #ffffff;
      padding: 8px; /* White border width */
      border-radius: 4px;
      display: inline-block;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    #qrcode-container canvas, 
    #qrcode-container img {
      display: block;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Local image placed above the header text -->
    <!-- Make sure your image file in the folder is named image.jpg (or update the filename in src) -->
    <img src="./image.jpeg" alt="Header Image" class="card-header-img">

    <h2>QR Code Generator</h2>
    
    <input type="text" id="qr-text" placeholder="Enter URL or Text" value="https://example.com">
    
    <div class="btn-group">
      <button class="btn-generate" onclick="generateQRCode()">Generate</button>
      <button class="btn-download" id="download-btn" onclick="downloadQRCode()" disabled>Download</button>
    </div>

    <div class="qr-preview-wrapper">
      <div id="qrcode-container"></div>
    </div>
  </div>

  <script>
    let qrcodeObj = null;

    function generateQRCode() {
      const text = document.getElementById("qr-text").value.trim();
      const container = document.getElementById("qrcode-container");
      const downloadBtn = document.getElementById("download-btn");

      if (!text) {
        alert("Please enter text or a URL!");
        return;
      }

      container.innerHTML = "";

      qrcodeObj = new QRCode(container, {
        text: text,
        width: 200,
        height: 200,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });

      downloadBtn.disabled = false;
    }

    function downloadQRCode() {
      const container = document.getElementById("qrcode-container");
      const sourceCanvas = container.querySelector("canvas");

      if (!sourceCanvas) return;

      const borderSize = 12; 
      const exportCanvas = document.createElement("canvas");
      const ctx = exportCanvas.getContext("2d");

      exportCanvas.width = sourceCanvas.width + (borderSize * 2);
      exportCanvas.height = sourceCanvas.height + (borderSize * 2);

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
      ctx.drawImage(sourceCanvas, borderSize, borderSize);

      const link = document.createElement("a");
      link.download = "qrcode-with-border.png";
      link.href = exportCanvas.toDataURL("image/png");
      link.click();
    }

    window.onload = generateQRCode;
  </script>

</body>
</html>
